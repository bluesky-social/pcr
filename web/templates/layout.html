{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {{if and .RefreshSec (gt .RefreshSec 0)}}<meta http-equiv="refresh" content="{{.RefreshSec}}">{{end}}
    <title>Production Change Registry</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body data-interface="phosphor-deck">
    <nav class="navbar" aria-label="Primary navigation">
        <a href="/" class="navbar-title"><span class="brand-code">PCR</span><span>Production Change Registry</span></a>
        {{if .UserName}}
        <div class="navbar-session">
            <a href="/events/new" class="navbar-action">Record change</a>
            <span class="navbar-user">Signed in as {{.UserName}}</span>
            <form method="POST" action="/logout" class="navbar-logout">
                <input type="hidden" name="csrf_token" value="{{.LogoutCSRF}}">
                <button type="submit">Logout</button>
            </form>
        </div>
        {{end}}
    </nav>
    <main class="container">
        {{template "content" .}}
    </main>
</body>
</html>{{end}}
