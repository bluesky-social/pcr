apiVersion: apps/v1
kind: Deployment
metadata:
  name: pcr-server
  namespace: pcr
  labels:
    app: pcr-server
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: pcr-server
  template:
    metadata:
      labels:
        app: pcr-server
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pcr-server
          image: pcr-server:latest
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: pcr-config
          env:
            - name: PCR_API_TOKENS
              valueFrom:
                secretKeyRef:
                  name: pcr-secrets
                  key: api-tokens
            - name: PCR_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: pcr-secrets
                  key: session-secret
            - name: PCR_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pcr-secrets
                  key: database-url
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
