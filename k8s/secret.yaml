apiVersion: v1
kind: Secret
metadata:
  name: pcr-secrets
  namespace: pcr
type: Opaque
stringData:
  api-tokens: "changeme"
  session-secret: "changeme-session-secret"
  database-url: "postgres://pcr:replace-me@postgres.example.internal:5432/pcr?sslmode=require"
  oauth-client-id: "replace-me"
  oauth-client-secret: "replace-me"
