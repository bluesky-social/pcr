version: 2

builds:
  - id: pcr
    main: ./cmd/pcr
    binary: pcr
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.buildDate={{.Date}}

archives:
  - id: pcr
    ids: [pcr]
    name_template: "pcr_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz

checksum:
  name_template: checksums.txt

release:
  draft: false
  prerelease: auto
  # Release Please creates the release first; GoReleaser appends the archives.
  mode: keep-existing
